<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    >

    <title>Sentiment App</title>
</head>

<body>
    <!-- LEFT SIDE -->
    <div class="split left">
        <div class="centered">
            <img src="{{ url_for('static', filename='products/img.png') }}" alt="Product">
        </div>
    </div>
    <!-- RIGHT SIDE -->
    <div class="split right">
        <div class="centered">

            <div class="sentiment-card">
                <h3 class="title">Sentiment Result</h3>

                <label class="positive">
                    Positive reviews: {{ data.positive }}
                </label>

                <label class="negative">
                    Negative reviews: {{ data.negative }}
                </label>

                <form method="post">
                    <textarea name="text"></textarea>
                           <input type="submit">
                </form>
            <div class="comment-botton bg white p-2 px-4">
                {% for review in data.reviews %}
            </hr>
                       <div 
                       class = "commented-section mt-2">
                       <div class = "d flex flex-row align-items-center commented user"
        </div>
                       <div class = "text-nowrap bd-highlight"> <span>{{review}}</span>  </div>
                
                        <hr/>                
                   
                      {% endfor %}

                       </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
